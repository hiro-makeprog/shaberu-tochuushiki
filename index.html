<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>しゃべる途中式 9.0号機（表示順調整版）</title>
<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#222;
  --muted:#666;
  --line:#d9dce5;
  --soft:#f1f2f6;
  --focus:#fff4b8;
  --point:#ffe0e0;
  --ok:#176c3a;
  --warn:#9b5a00;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic","Hiragino Sans",sans-serif
}
.wrap{max-width:860px;margin:auto;padding:16px 14px 42px}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:var(--muted);line-height:1.55;margin-bottom:12px}
.card{
  background:var(--card);border-radius:20px;padding:16px;margin:12px 0;
  box-shadow:0 4px 16px rgba(0,0,0,.055)
}
.title{font-size:20px;font-weight:850;margin-bottom:10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menuBtn{
  border:2px solid var(--line);background:#fff;border-radius:16px;
  padding:17px 12px;font-size:18px;font-weight:850;text-align:left;line-height:1.35
}
.menuBtn small{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.menuBtn.active{border-color:#111;background:var(--soft)}
.hidden{display:none!important}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
label{display:block;font-size:14px;font-weight:750;margin-bottom:6px}
input,select{
  width:100%;font-size:24px;padding:13px;border:1px solid var(--line);
  border-radius:14px;background:#fff
}
.sign{font-size:34px;font-weight:900;padding-bottom:8px;text-align:center}
.btn{
  border:none;border-radius:14px;padding:14px 16px;font-size:18px;
  font-weight:850;background:#ececf2;color:#222
}
.btn.primary{background:#111;color:#fff}
.btn.danger{background:#f4ebeb;color:#572f2f}
.successFlash{
  margin:12px 0 4px;padding:16px 18px;border:3px solid #bfe2c8;
  border-radius:18px;background:#f1fbf4;color:#176c3a;
  font-size:24px;font-weight:950;line-height:1.45;text-align:center
}
.successFlash .small{display:block;margin-top:5px;font-size:17px;font-weight:800}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.msg{font-weight:800;line-height:1.5;min-height:24px;margin-top:8px}
.ok{color:var(--ok)}.warn{color:var(--warn)}

.helper{
  border-radius:14px;padding:12px 14px;margin:10px 0;background:#f7f7fa;
  font-size:18px;font-weight:850
}
.helper strong{font-size:22px}

/* 位取り表 */
.boardWrap{
  overflow-x:auto;
  padding-bottom:4px;
  display:flex;
  justify-content:center;
}
.board{
  display:grid;
  grid-template-columns:54px repeat(var(--cols), minmax(64px,1fr));
  width:min(100%, 760px);
  min-width:460px;
  border:2px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:#fff
}
@media (max-width: 640px){
  .wrap{padding-left:8px;padding-right:8px}
  .card{padding:12px;border-radius:16px}
  .boardWrap{justify-content:flex-start}
  .board{
    width:100%;
    min-width:0;
    grid-template-columns:44px repeat(var(--cols), minmax(0,1fr));
  }
  .cell{min-height:58px;font-size:24px;padding:2px}
  .head{min-height:46px;font-size:12px;line-height:1.2;padding:2px}
  .moveCell{min-height:44px;font-size:15px}
  .answerCell input{
    width:min(44px, 82%);
    height:46px;
    font-size:24px;
  }
  .helper{font-size:16px;padding:10px 12px}
  .helper strong{font-size:20px}
}
@media (min-width: 900px){
  .wrap{max-width:980px}
  .board{width:min(100%, 860px)}
  .cell{min-height:74px;font-size:34px}
  .head{font-size:15px}
  .answerCell input{width:56px;height:56px;font-size:32px}
}
.cell{
  min-height:66px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;
  font-size:30px;font-weight:850;padding:4px
}
.head{
  min-height:50px;background:#f7f7fa;font-size:14px;color:#555;font-weight:850;text-align:center
}
.pointCol{background:var(--point)!important}
.activeCol{background:var(--focus)!important}
.opCell{font-size:27px}
.answerCell input{
  width:48px;height:50px;padding:4px;text-align:center;font-size:28px;
  font-weight:850;border:2px solid #bbb;border-radius:10px
}
.answerCell input:focus{border-color:#111;outline:none;background:#fffdf0}
.carry{
  position:absolute;top:2px;right:5px;font-size:14px;color:#777;font-weight:900
}
.moveCell{
  min-height:50px;
  background:var(--soft);
  font-size:18px;
  font-weight:900;
  text-align:center;
}
.moveCell.activeCol{background:var(--focus)!important}
.moveMark{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:34px;
  min-height:32px;
  padding:2px 6px;
  border:2px solid var(--line);
  border-radius:9px;
  background:#fff;
  line-height:1.1;
}
.moveMark.carryMark{border-color:#777}
.moveMark.borrowMark{border-style:dashed}

/* くり下がり：タップで10を借りる */
.topDigitCell.borrowTap{
  cursor:pointer;
  outline:3px solid transparent;
  outline-offset:-4px;
}
.topDigitCell.borrowTap::after{
  content:"タップ";
  position:absolute;bottom:2px;right:3px;
  font-size:9px;font-weight:800;color:#777;
}
.topDigitCell.borrowReady{background:#eef8ff!important}
.borrowPrompt{
  margin:10px 0;padding:14px;border:3px solid #222;border-radius:16px;
  background:#fff;text-align:center;font-weight:900;
}
.borrowPrompt .borrowQ{font-size:22px;line-height:1.45;margin-bottom:10px}
.borrowActions{display:flex;justify-content:center;gap:12px}
.borrowChoice{
  min-width:82px;min-height:52px;border:2px solid #999;border-radius:14px;
  background:#fff;font-size:27px;font-weight:950;
}
.borrowChoice.yes{border-color:#2d7a46;background:#eef9f1}
.borrowChoice.no{border-color:#9a4a4a;background:#fff3f3}
.borrowHint{font-size:13px;color:#666;margin-top:8px}
.decimalDot{font-size:34px;font-weight:950}
.stepList{margin-top:14px}
.step{
  border:2px solid var(--line);border-radius:14px;padding:11px 13px;margin:8px 0;
  font-size:18px;font-weight:780;line-height:1.5;background:#fff
}
.step.done{background:#f5fbf6;border-color:#d4ead9}
.step strong{font-size:20px}

/* 見るだけ */
.viewerTitle{font-size:18px;font-weight:850;margin-bottom:8px}

/* 小数ブロック */
.blocks{
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:12px;
  border:2px solid var(--line);border-radius:16px;background:#fff;min-height:132px
}
.blockGroup{
  display:flex;flex-wrap:wrap;gap:0;align-items:flex-end;align-content:flex-end
}
.blockGroup.hundredths{
  width:100px;
}
.blockOne{
  width:100px;height:100px;border:2px solid #777;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto
}
.blockTenth{
  width:10px;height:100px;border:1px solid #777;border-radius:0;flex:0 0 auto
}
.blockHundredth{
  width:10px;height:10px;border:1px solid #777;border-radius:0;flex:0 0 auto
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#555;margin-top:8px}
.ratioNote{font-size:13px;color:#666;margin-top:6px;line-height:1.5}

/* 割り算 */
.longdiv{max-width:540px;margin:10px auto;font-size:30px;font-weight:850}
.ldRow{display:grid;grid-template-columns:90px 1fr;align-items:end}
.ldDivisor{text-align:right;padding:8px 8px 8px 0}
.ldBody{border-left:3px solid #222;border-top:3px solid #222;padding:8px 10px;min-height:60px}
.ldQuot{margin-left:90px;padding:8px 10px;border-bottom:1px dashed #ccc}
.ldInput{width:76px!important;text-align:center!important}
</style>
</head>

<body>
<div class="wrap">
  <h1>🧮 しゃべる途中式 9.0号機（表示順調整版）</h1>
  <div class="sub">「数字どこいった？」を防ぐ、くり上がり・くり下がり可視化版。</div>

  <div class="card">
    <div class="title">① 何をしたい？</div>
    <div class="menu">
      <button class="menuBtn" data-helper="calc">筆算でとく<small>マスを順番に埋める</small></button>
      <button class="menuBtn" data-helper="place">位をそろえて見る<small>小数点・一の位・十分の位を確認</small></button>
      <button class="menuBtn" data-helper="blocks">ブロックで見る<small>小数を「量」として見る</small></button>
      <button class="menuBtn" data-helper="diagram">問題を図にする<small>簡易版：増える？減る？を整理</small></button>
    </div>
  </div>

  <!-- 筆算 -->
  <div id="calcPanel" class="card hidden">
    <div class="title">② どんな計算？</div>
    <div class="menu">
      <button class="menuBtn calcMode" data-mode="add">たし算<small>くり上がり対応</small></button>
      <button class="menuBtn calcMode" data-mode="sub">ひき算<small>くり下がり対応</small></button>
      <button class="menuBtn calcMode" data-mode="mul">かけ算<small>位をそろえて答えを入れる</small></button>
      <button class="menuBtn calcMode" data-mode="div">わり算<small>あまり対応</small></button>
      <button class="menuBtn calcMode" data-mode="dadd">小数のたし算<small>小数点を固定</small></button>
      <button class="menuBtn calcMode" data-mode="dsub">小数のひき算<small>小数点を固定</small></button>
    </div>

    <div id="calcInput" class="hidden" style="margin-top:14px">
      <div class="row3">
        <div><label>上の数</label><input id="a" inputmode="decimal" placeholder="29"></div>
        <div id="calcSign" class="sign">＋</div>
        <div><label>下の数</label><input id="b" inputmode="decimal" placeholder="23"></div>
      </div>
      <div class="row2" style="margin-top:12px">
        <button id="startCalc" class="btn primary">筆算スタート</button>
        <button id="clearCalc" class="btn">入力を消す</button>
      </div>
      <div id="calcInputMsg" class="msg"></div>
    </div>
  </div>

  <div id="calcWork" class="card hidden">
    <div class="title">③ ここを見よう</div>
    <div id="helperText" class="helper"></div>
    <div id="borrowPromptArea"></div>
      <div id="boardArea"></div>
    <div id="stepList" class="stepList"></div>
    <div id="calcWorkMsg" class="msg"></div>
    <div id="successFlash" class="successFlash hidden"></div>
    <div class="row2" style="margin-top:14px">
      <button id="checkCalc" class="btn primary">この位を確認</button>
      <button id="resetCalc" class="btn danger">🗑️ この問題をやめる</button>
    </div>
  </div>

  <!-- 位を見る -->
  <div id="placePanel" class="card hidden">
    <div class="title">② 位をそろえて見る</div>
    <div class="row2">
      <div><label>上の数</label><input id="placeA" inputmode="decimal" placeholder="1.2"></div>
      <div><label>下の数</label><input id="placeB" inputmode="decimal" placeholder="0.35"></div>
    </div>
    <button id="showPlace" class="btn primary" style="width:100%;margin-top:12px">そろえて見る</button>
    <div id="placeViewer" style="margin-top:14px"></div>
  </div>

  <!-- ブロック -->
  <div id="blockPanel" class="card hidden">
    <div class="title">② 小数をブロックで見る</div>
    <label>見たい数</label>
    <input id="blockNumber" inputmode="decimal" placeholder="1.25">
    <button id="showBlocks" class="btn primary" style="width:100%;margin-top:12px">ブロックにする</button>
    <div id="blockResult" style="margin-top:14px"></div>
  </div>

  <!-- 簡易図式 -->
  <div id="diagramPanel" class="card hidden">
    <div class="title">② 問題を図にする（簡易版）</div>
    <div class="note">今は文章を自動で読む前の練習版。数字と「増える・減る」を選ぶよ。</div>
    <div class="row2" style="margin-top:10px">
      <div><label>もともとの数</label><input id="baseNum" inputmode="decimal" placeholder="12"></div>
      <div><label>増えた / 減った数</label><input id="changeNum" inputmode="decimal" placeholder="5"></div>
    </div>
    <div class="row2" style="margin-top:10px">
      <button class="btn diagramType" data-type="plus">➕ 増える</button>
      <button class="btn diagramType" data-type="minus">➖ 減る</button>
    </div>
    <button id="showDiagram" class="btn primary" style="width:100%;margin-top:12px">図にする</button>
    <div id="diagramResult" style="margin-top:14px"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let helperMode=null, calcMode=null, calcState=null, diagramType=null;
const signs={add:"＋",sub:"−",mul:"×",div:"÷",dadd:"＋",dsub:"−"};

document.querySelectorAll("[data-helper]").forEach(btn=>{
  btn.onclick=()=>{
    helperMode=btn.dataset.helper;
    document.querySelectorAll("[data-helper]").forEach(x=>x.classList.toggle("active",x===btn));
    ["calcPanel","placePanel","blockPanel","diagramPanel"].forEach(id=>$(id).classList.add("hidden"));
    $(helperMode==="calc"?"calcPanel":helperMode==="place"?"placePanel":helperMode==="blocks"?"blockPanel":"diagramPanel").classList.remove("hidden");
  };
});

document.querySelectorAll(".calcMode").forEach(btn=>{
  btn.onclick=()=>{
    calcMode=btn.dataset.mode;
    document.querySelectorAll(".calcMode").forEach(x=>x.classList.toggle("active",x===btn));
    $("calcSign").textContent=signs[calcMode];
    $("calcInput").classList.remove("hidden");
    $("calcWork").classList.add("hidden");
    $("a").value="";$("b").value="";
    $("calcInputMsg").textContent="";
  };
});

$("clearCalc").onclick=()=>{$("a").value="";$("b").value="";$("calcInputMsg").textContent=""};
$("resetCalc").onclick=()=>{
  $("calcWork").classList.add("hidden");
  $("successFlash").classList.add("hidden");
  $("successFlash").innerHTML="";
  calcState=null;
};

function decimals(s){return (String(s).split(".")[1]||"").length}
function normalize(s,p){return Number(s).toFixed(p)}
function aligned(a,b,decimal,minIntLen=0){
  const p=decimal?Math.max(decimals(a),decimals(b)):0;
  let A=decimal?normalize(a,p):String(Math.trunc(Number(a)));
  let B=decimal?normalize(b,p):String(Math.trunc(Number(b)));
  let aa=A.split("."),bb=B.split(".");
  const intLen=Math.max(aa[0].length,bb[0].length,minIntLen);
  aa[0]=aa[0].padStart(intLen," ");
  bb[0]=bb[0].padStart(intLen," ");
  A=p?aa[0]+"."+aa[1]:aa[0];
  B=p?bb[0]+"."+bb[1]:bb[0];
  return {A,B,p,intLen};
}

function neededIntLen(a,b,op,decimal){
  const na=Number(a), nb=Number(b);
  let result=0;
  if(op==="＋") result=na+nb;
  else if(op==="−") result=na-nb;
  else if(op==="×") result=na*nb;
  else result=Math.max(Math.abs(na),Math.abs(nb));

  // 答えの整数部分が何桁になるかを先に調べる。
  // 例：14×20=280 → 3桁、99×99=9801 → 4桁。
  const abs=Math.abs(result);
  const resultIntLen=abs<1 ? 1 : String(Math.trunc(abs)).length;

  const aInt=String(a).replace(/^[-+]/,"").split(".")[0].replace(/^0+(?=\d)/,"").length || 1;
  const bInt=String(b).replace(/^[-+]/,"").split(".")[0].replace(/^0+(?=\d)/,"").length || 1;

  return Math.max(aInt,bInt,resultIntLen);
}
function namesFor(intLen,p){
  const n=[];
  for(let i=0;i<intLen;i++){
    const pow=intLen-1-i;
    n.push(pow===0?"一の位":pow===1?"十の位":pow===2?"百の位":pow===3?"千の位":`10^${pow}`);
  }
  if(p){
    n.push(".");
    const dn=["十分の位","百分の位","千分の位","万分の位"];
    for(let i=0;i<p;i++)n.push(dn[i]||`小数第${i+1}位`);
  }
  return n;
}
function chars(s){return [...s].map(c=>c===" "?"":c)}
function rightmostDigit(names){for(let i=names.length-1;i>=0;i--)if(names[i]!==".")return i;return-1}
function prevDigit(i){for(let k=i-1;k>=0;k--)if(calcState.names[k]!==".")return k;return-1}
function nextPlaceNameFrom(i){
  const next=prevDigit(i);
  if(next<0)return "左の位";
  return calcState.names[next];
}
function digitAt(arr,i){const c=arr[i];return c&&c!=="."?Number(c):0}
function cell(text,cls=""){const d=document.createElement("div");d.className="cell "+cls;d.textContent=text;return d}

function makeBoard(a,b,op,decimal){
  // 入力された数だけでなく「答え」に必要な位まで盤面を自動増築する。
  const minIntLen=neededIntLen(a,b,op,decimal);
  const al=aligned(a,b,decimal,minIntLen),names=namesFor(al.intLen,al.p),A=chars(al.A),B=chars(al.B);
  calcState={
    a:Number(a),b:Number(b),op,decimal,al,names,A,B,
    current:rightmostDigit(names),
    carry:Array(names.length).fill(""),
    move:Array(names.length).fill(""),
    steps:[],
    borrowPrepared:Array(names.length).fill(false),
    kind:null
  };

  const wrap=document.createElement("div");wrap.className="boardWrap";
  const board=document.createElement("div");board.className="board";board.style.setProperty("--cols",names.length);

  board.append(cell("","head"));
  names.forEach((n,i)=>board.append(cell(n,"head "+(n==="."?"pointCol":"")+" col-"+i)));

  board.append(cell("うごき","head"));
  names.forEach((n,i)=>{
    const c=document.createElement("div");
    c.className="cell moveCell "+(n==="."?"pointCol ":"")+"col-"+i;
    c.id="move-"+i;
    if(n===".") c.textContent=".";
    board.append(c);
  });

  board.append(cell("","opCell"));
  A.forEach((v,i)=>{
    const c=cell(v,(calcState.names[i]==="."?"pointCol decimalDot ":"")+"col-"+i+" topDigitCell");
    c.dataset.topIdx=i;
    c.addEventListener("click",()=>handleTopDigitTap(i));
    board.append(c);
  });

  board.append(cell(op,"opCell"));
  B.forEach((v,i)=>board.append(cell(v,(calcState.names[i]==="."?"pointCol decimalDot ":"")+"col-"+i)));

  board.append(cell("","opCell"));
  names.forEach((n,i)=>{
    const c=document.createElement("div");
    c.className="cell answerCell "+(n==="."?"pointCol ":"")+"col-"+i;
    if(n==="."){
      c.textContent=".";
      c.classList.add("decimalDot");
    }else{
      const inp=document.createElement("input");
      inp.inputMode="numeric";inp.maxLength=1;inp.dataset.idx=i;
      inp.oninput=()=>inp.value=inp.value.replace(/\D/g,"").slice(-1);
      inp.onkeydown=e=>{if(e.key==="Enter")$("checkCalc").click()};
      c.append(inp);
      const sp=document.createElement("span");sp.className="carry";sp.id="carry-"+i;c.append(sp);
    }
    board.append(c);
  });

  wrap.append(board);$("boardArea").innerHTML="";$("boardArea").append(wrap);
  hideBorrowPrompt();
  renderCalcUI();
}
function effectiveTopAt(i){
  return digitAt(calcState.A,i)-Number(calcState.carry[i]||0);
}
function borrowNeededAt(i){
  if(!calcState || calcState.kind!=="sub" || i<0 || calcState.names[i]===".")return false;
  const y=digitAt(calcState.B,i);
  return effectiveTopAt(i)<y;
}
function hideBorrowPrompt(){
  const area=$("borrowPromptArea");
  if(area)area.innerHTML="";
}
function handleTopDigitTap(i){
  if(!calcState || calcState.kind!=="sub" || calcState.current<0)return;
  const cur=calcState.current, source=prevDigit(cur);
  if(i!==cur && i!==source)return;
  if(calcState.borrowPrepared[cur]){
    $("calcWorkMsg").className="msg ok";
    $("calcWorkMsg").textContent="もう10を借りてあるよ。上の『うごき』を見てね。";
    return;
  }
  if(!borrowNeededAt(cur)){
    $("calcWorkMsg").className="msg ok";
    $("calcWorkMsg").textContent="この列は、そのまま引けるよ。";
    return;
  }
  if(source<0 || effectiveTopAt(source)<=0){
    $("calcWorkMsg").className="msg warn";
    $("calcWorkMsg").textContent="左の位からすぐには借りられないよ。次の版で連続くり下がりにも対応予定。";
    return;
  }
  const area=$("borrowPromptArea");
  area.innerHTML=`<div class="borrowPrompt"><div class="borrowQ">🤔 ${calcState.names[source]}から<br><strong>10 借りる？</strong></div><div class="borrowActions"><button type="button" class="borrowChoice yes" id="borrowYes">○</button><button type="button" class="borrowChoice no" id="borrowNo">×</button></div><div class="borrowHint">○を押すと、数字の「うごき」が先に見えるよ</div></div>`;
  $("borrowYes").onclick=()=>prepareBorrow(cur);
  $("borrowNo").onclick=()=>{hideBorrowPrompt();$("calcWorkMsg").className="msg";$("calcWorkMsg").textContent="OK。もう一度数字を見て考えてみよう。"};
}
function prepareBorrow(i){
  const source=prevDigit(i);
  const originalTop=effectiveTopAt(i);
  const sourceBefore=effectiveTopAt(source);
  if(source<0 || sourceBefore<=0)return;
  setCarry(source,Number(calcState.carry[source]||0)+1);
  setMove(i,`<span class="moveMark borrowMark">${originalTop}→${originalTop+10}</span>`);
  setMove(source,`<span class="moveMark borrowMark">${sourceBefore}→${sourceBefore-1}</span>`);
  calcState.borrowPrepared[i]=true;
  hideBorrowPrompt();
  $("calcWorkMsg").className="msg ok";
  $("calcWorkMsg").textContent=`10を借りたよ。${originalTop}が${originalTop+10}になった！`;
  renderCalcUI();
}

function renderCalcUI(){
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("activeCol"));
  if(calcState.current>=0){
    document.querySelectorAll(".col-"+calcState.current).forEach(c=>c.classList.add("activeCol"));
  }
  document.querySelectorAll(".topDigitCell").forEach(c=>c.classList.remove("borrowTap","borrowReady"));
  if(calcState.kind==="sub" && calcState.current>=0){
    const cur=calcState.current, source=prevDigit(cur);
    if(calcState.borrowPrepared && calcState.borrowPrepared[cur]){
      document.querySelectorAll(`.topDigitCell[data-top-idx="${cur}"],.topDigitCell[data-top-idx="${source}"]`).forEach(c=>c.classList.add("borrowReady"));
    }else if(borrowNeededAt(cur)){
      document.querySelectorAll(`.topDigitCell[data-top-idx="${cur}"],.topDigitCell[data-top-idx="${source}"]`).forEach(c=>c.classList.add("borrowTap"));
    }
  }
  document.querySelectorAll(".answerCell input").forEach(inp=>{
    const idx=Number(inp.dataset.idx);
    const waitingBorrow=calcState.kind==="sub" && idx===calcState.current && borrowNeededAt(idx) && !(calcState.borrowPrepared&&calcState.borrowPrepared[idx]);
    inp.disabled=idx!==calcState.current || waitingBorrow;
  });
  const inp=document.querySelector(`input[data-idx="${calcState.current}"]`);
  if(inp)inp.focus();

  const place=calcState.current>=0?calcState.names[calcState.current]:"おわり";
  const hasMove=calcState.move.some(Boolean);
  const needsBorrow=calcState.kind==="sub" && calcState.current>=0 && borrowNeededAt(calcState.current) && !(calcState.borrowPrepared&&calcState.borrowPrepared[calcState.current]);
  $("helperText").innerHTML=calcState.current>=0
    ? `<strong>いま見るのは「${place}」</strong><br>${needsBorrow?"上の数字をタップしてみよう 👆":(hasMove?"上の「うごき」の数字も一緒に見よう。":"黄色のたて列だけ見よう。")}`
    : `<strong>できた！</strong>`;

  clearMoveVisuals();

  $("stepList").innerHTML="";
  calcState.steps.forEach(s=>{
    const d=document.createElement("div");d.className="step done";
    d.innerHTML=`<strong>${s.title}</strong><br>${s.text}`;
    $("stepList").append(d);
  });
}
function setCarry(i,v){
  if(i>=0){
    calcState.carry[i]=v;
    const el=$("carry-"+i);if(el)el.textContent=v?String(v):"";
  }
}
function setMove(i,html){
  if(i<0)return;
  calcState.move[i]=html||"";
  const el=$("move-"+i);
  if(el)el.innerHTML=html||"";
}
function clearMoveVisuals(){
  calcState.move.forEach((_,i)=>{
    const el=$("move-"+i);
    if(el)el.innerHTML=calcState.move[i]||"";
  });
}
function showCorrectFeedback(place, detail){
  const box=$("successFlash");
  box.innerHTML=`✅ 合ってるよー！<span class="small">${place}：${detail}</span>`;
  box.classList.remove("hidden");
}
function finishCalc(){
  if(calcState.current<0){
    $("calcWorkMsg").className="msg ok";
    $("calcWorkMsg").textContent="🎉 位をそろえて最後までできた！";
    $("checkCalc").disabled=true;
    renderCalcUI();
  }
}

function checkAddSub(){
  const i=calcState.current;
  const inp=document.querySelector(`input[data-idx="${i}"]`);
  if(!inp||inp.value===""){ $("successFlash").classList.add("hidden");$("calcWorkMsg").className="msg warn";$("calcWorkMsg").textContent="黄色のマスに答えを入れてね。";return; }
  const given=Number(inp.value),x=digitAt(calcState.A,i),y=digitAt(calcState.B,i),incoming=Number(calcState.carry[i]||0);

  if(calcState.kind==="add"){
    const total=x+y+incoming,digit=total%10,carry=Math.floor(total/10);
    if(given!==digit){
      $("calcWorkMsg").className="msg warn";
      $("calcWorkMsg").textContent="おしい！黄色の列だけもう一回。";
      return;
    }
    const next=prevDigit(i);
    if(carry){
      setCarry(next,carry);
      setMove(next,`<span class="moveMark carryMark">${carry}</span>`);
    }
    calcState.steps.push({
      title:calcState.names[i],
      text:`${x} ＋ ${y}${incoming?` ＋ ${incoming}`:""} ＝ ${total} → ${digit}を書く${carry?`。${carry}は${nextPlaceNameFrom(i)}の上へ移動`:""}`
    });
    showCorrectFeedback(
      calcState.names[i],
      `${x} ＋ ${y}${incoming?` ＋ ${incoming}`:""} ＝ ${total}。${digit}で正解！${carry?` ${carry}は${nextPlaceNameFrom(i)}へ。`:""}`
    );
    calcState.current=next;
  }else{
    const prepared=!!(calcState.borrowPrepared&&calcState.borrowPrepared[i]);
    let top=x-incoming;
    const originalTop=top;
    const needs=top<y;
    if(needs && !prepared){
      $("successFlash").classList.add("hidden");
      $("calcWorkMsg").className="msg warn";
      $("calcWorkMsg").textContent="このままでは引けないよ。上の数字をタップして『10借りる？』を選んでみよう。";
      return;
    }
    if(prepared)top+=10;
    const digit=top-y;
    if(given!==digit){
      $("calcWorkMsg").className="msg warn";
      $("calcWorkMsg").textContent="おしい！上の『うごき』を見ながら、黄色の列をもう一回。";
      return;
    }
    calcState.steps.push({
      title:calcState.names[i],
      text:prepared
        ? `${originalTop}では引けない → 10を借りて ${top}。${top} − ${y} ＝ ${digit}`
        : `${top} − ${y} ＝ ${digit}`
    });
    showCorrectFeedback(
      calcState.names[i],
      `${top} − ${y} ＝ ${digit}。${digit}で正解！`
    );
    calcState.current=prevDigit(i);
  }
  $("calcWorkMsg").textContent="";
  renderCalcUI();finishCalc();
}

function startDivision(a,b){
  const A=Math.trunc(Number(a)),B=Math.trunc(Number(b));
  if(!Number.isInteger(A)||!Number.isInteger(B)||A<0||B<=0)throw Error("0以上の整数 ÷ 1以上の整数で入れてね。");
  const q=Math.floor(A/B),r=A%B;
  calcState={kind:"div",a:A,b:B,q,r};
  $("helperText").innerHTML="<strong>わる数が何回入る？</strong><br>商 → あまり の順で考えよう。";
  $("boardArea").innerHTML=`
    <div class="longdiv">
      <div class="ldQuot">商：<input id="qInput" class="ldInput" inputmode="numeric" placeholder="?"></div>
      <div class="ldRow"><div class="ldDivisor">${B}</div><div class="ldBody">${A}</div></div>
      <div class="ldQuot">あまり：<input id="rInput" class="ldInput" inputmode="numeric" placeholder="?"></div>
    </div>`;
  $("stepList").innerHTML="";
}
function checkDivision(){
  const qv=$("qInput").value,rv=$("rInput").value;
  if(qv===""||Number(qv)!==calcState.q){$("successFlash").classList.add("hidden");$("calcWorkMsg").className="msg warn";$("calcWorkMsg").textContent="まず商を考えてみよう。";return}
  if(rv===""||Number(rv)!==calcState.r){$("successFlash").classList.add("hidden");$("calcWorkMsg").className="msg warn";$("calcWorkMsg").textContent="商はOK！次はあまり。";return}
  $("stepList").innerHTML=`
    <div class="step done"><strong>何回入る？</strong><br>${calcState.b} × ${calcState.q} ＝ ${calcState.b*calcState.q}</div>
    <div class="step done"><strong>あまり</strong><br>${calcState.a} − ${calcState.b*calcState.q} ＝ ${calcState.r}</div>
    <div class="step done"><strong>答え</strong><br>${calcState.q} あまり ${calcState.r}</div>`;
  showCorrectFeedback("わり算",`商 ${calcState.q}、あまり ${calcState.r}。ばっちり！`);
  $("calcWorkMsg").className="msg ok";$("calcWorkMsg").textContent="🎉 最後までできた！";
  $("checkCalc").disabled=true;
}

$("startCalc").onclick=()=>{
  try{
    $("checkCalc").disabled=false;
    const a=$("a").value.trim(),b=$("b").value.trim();
    if(a===""||b==="")throw Error("2つの数を入れてね。");
    $("calcInputMsg").textContent="";$("calcWorkMsg").textContent="";
    $("successFlash").classList.add("hidden");
    $("successFlash").innerHTML="";
    $("calcWork").classList.remove("hidden");

    if(calcMode==="div"){startDivision(a,b);return}

    const na=Number(a),nb=Number(b);
    if(!Number.isFinite(na)||!Number.isFinite(nb))throw Error("数字を入れてね。");
    if(["add","sub","mul"].includes(calcMode)&&(!Number.isInteger(na)||!Number.isInteger(nb)))throw Error("このモードは整数で入れてね。");
    if(["sub","dsub"].includes(calcMode)&&na<nb)throw Error("今は上の数を大きくしてね。");

    const decimal=["dadd","dsub"].includes(calcMode);
    makeBoard(a,b,signs[calcMode],decimal);

    if(calcMode==="mul"){
      calcState.kind="mul";
    }else{
      calcState.kind=["add","dadd"].includes(calcMode)?"add":"sub";
    }
    renderCalcUI();
  }catch(e){
    $("calcWork").classList.add("hidden");
    $("calcInputMsg").className="msg warn";$("calcInputMsg").textContent=e.message;
  }
};

$("checkCalc").onclick=()=>{
  if(!calcState)return;
  if(calcState.kind==="div"){checkDivision();return}
  if(calcState.kind==="mul"){
    const i=calcState.current;
    const inp=document.querySelector(`input[data-idx="${i}"]`);
    if(!inp||inp.value===""){ $("successFlash").classList.add("hidden");$("calcWorkMsg").className="msg warn";$("calcWorkMsg").textContent="黄色のマスに答えを入れてね。";return; }
    const product=Math.trunc(calcState.a*calcState.b);
    const posFromRight=calcState.names.slice(i+1).filter(x=>x!==".").length;
    const rev=String(product).split("").reverse();
    const exp=Number(rev[posFromRight]||0);
    if(Number(inp.value)!==exp){$("successFlash").classList.add("hidden");$("calcWorkMsg").className="msg warn";$("calcWorkMsg").textContent="おしい！黄色の列だけもう一回。";return}
    calcState.steps.push({title:calcState.names[i],text:`答えのこの位は ${exp}`});
    showCorrectFeedback(calcState.names[i],`${exp}で正解！`);
    calcState.current=prevDigit(i);
    $("calcWorkMsg").textContent="";
    renderCalcUI();finishCalc();return;
  }
  checkAddSub();
};

/* 位をそろえて見る */
$("showPlace").onclick=()=>{
  const a=$("placeA").value.trim(),b=$("placeB").value.trim();
  if(a===""||b===""||!Number.isFinite(Number(a))||!Number.isFinite(Number(b)))return;
  const al=aligned(a,b,true),names=namesFor(al.intLen,al.p),A=chars(al.A),B=chars(al.B);
  const wrap=document.createElement("div");wrap.className="boardWrap";
  const board=document.createElement("div");board.className="board";board.style.setProperty("--cols",names.length);
  board.append(cell("","head"));
  names.forEach((n,i)=>board.append(cell(n,"head "+(n==="."?"pointCol":"")+" col-"+i)));
  board.append(cell("","opCell"));A.forEach((v,i)=>board.append(cell(v,(names[i]==="."?"pointCol decimalDot ":""))));
  board.append(cell("","opCell"));B.forEach((v,i)=>board.append(cell(v,(names[i]==="."?"pointCol decimalDot ":""))));
  wrap.append(board);
  $("placeViewer").innerHTML="<div class='viewerTitle'>小数点の列をそろえると、同じ位どうしが上下に並ぶよ。</div>";
  $("placeViewer").append(wrap);
};

/* 小数ブロック */
$("showBlocks").onclick=()=>{
  const raw=$("blockNumber").value.trim(),n=Number(raw);
  if(!Number.isFinite(n)||n<0){$("blockResult").innerHTML="<div class='msg warn'>0以上の数を入れてね。</div>";return}
  const fixed=n.toFixed(2), parts=fixed.split("."), ones=Number(parts[0]), tenths=Number(parts[1][0]), hundredths=Number(parts[1][1]);
  let h=`<div class="helper"><strong>${raw}</strong> を量にすると…</div><div class="blocks">`;
  h+=`<div class="blockGroup ones">`;
  for(let i=0;i<Math.min(ones,12);i++)h+=`<div class="blockOne">1</div>`;
  h+=`</div><div class="blockGroup tenths">`;
  for(let i=0;i<tenths;i++)h+=`<div class="blockTenth" title="0.1"></div>`;
  h+=`</div><div class="blockGroup hundredths">`;
  for(let i=0;i<hundredths;i++)h+=`<div class="blockHundredth" title="0.01"></div>`;
  h+=`</div></div><div class="legend"><span>□ 大きい四角＝1</span><span>▯ 細い棒＝0.1</span><span>▫ 小さいマス＝0.01</span></div>`;
  h+=`<div class="ratioNote">0.1を10こ並べると1こ分。0.01を10こ並べると0.1こ分、100こで1こ分。</div>`;
  h+=`<div class="step done"><strong>分けると</strong><br>${ones} ＋ ${tenths/10} ＋ ${hundredths/100}</div>`;
  $("blockResult").innerHTML=h;
};

/* 簡易図式 */
document.querySelectorAll(".diagramType").forEach(btn=>{
  btn.onclick=()=>{
    diagramType=btn.dataset.type;
    document.querySelectorAll(".diagramType").forEach(x=>x.classList.toggle("primary",x===btn));
  };
});
$("showDiagram").onclick=()=>{
  const a=Number($("baseNum").value),b=Number($("changeNum").value);
  if(!Number.isFinite(a)||!Number.isFinite(b)||!diagramType)return;
  const result=diagramType==="plus"?a+b:a-b;
  const arrow=diagramType==="plus"?"➡️ 増える ➡️":"➡️ 減る ➡️";
  $("diagramResult").innerHTML=`
    <div class="helper"><strong>${a}</strong> ${arrow} <strong>${b}</strong></div>
    <div class="step done"><strong>式にすると</strong><br>${a} ${diagramType==="plus"?"＋":"−"} ${b} ＝ ${result}</div>`;
};
</script>
