<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>しゃべる途中式 4号機</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#222;--muted:#666;--line:#d9d9df;--ok:#16733c;--warn:#a45d00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic","Hiragino Sans",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}
h1{font-size:27px;margin:8px 0 4px}.sub{color:var(--muted);line-height:1.5;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.055)}
.title{font-size:19px;font-weight:800;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
input{width:100%;font-size:24px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.btn,.op,.pick{border:none;border-radius:14px;padding:14px;font-size:18px;font-weight:750}
.btn{background:#ececf2}.btn.primary{background:#111;color:#fff}.btn.danger{background:#f3eaea;color:#532b2b}
.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.op{background:#fff;border:2px solid var(--line);font-size:27px;padding:12px 4px}
.formula-stack{margin:8px 0 14px}
.formula-row{display:grid;grid-template-columns:34px 1fr;gap:4px;align-items:center;margin:8px 0}
.equals{font-size:28px;font-weight:800;text-align:center;color:#555}
.equals.blank{color:transparent}
.formula-box{min-height:70px;border:2px solid var(--line);border-radius:15px;padding:12px 14px;background:#fff;font-size:29px;font-weight:800;line-height:1.5;display:flex;align-items:center;word-break:break-word}
.formula-box.empty{color:#999;font-size:20px;font-weight:650}
.work{border-top:1px solid #eee;padding-top:14px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick{background:#fff;border:2px solid #bbb;font-size:21px}
.pick.active{border-color:#111;background:#f0f0f3}
.selected{font-size:21px;font-weight:800;min-height:32px}
.msg{font-weight:700;line-height:1.5;min-height:24px;margin-top:8px}.ok{color:var(--ok)}.warn{color:var(--warn)}
.tiny{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>🗣️ しゃべる途中式 4号機</h1>
<div class="sub">書く代わりに、選ぶ・数字を入れる。途中式はノートみたいに下へ続くよ。</div>

<div class="card">
  <div class="title">① 元の式を作る</div>
  <div class="row">
    <input id="num" inputmode="decimal" placeholder="数字">
    <button id="addNum" class="btn primary">数字を追加</button>
  </div>
  <div class="ops">
    <button class="op" data-t="+">＋</button>
    <button class="op" data-t="-">−</button>
    <button class="op" data-t="*">×</button>
    <button class="op" data-t="/">÷</button>
    <button class="op" data-t="(">（</button>
    <button class="op" data-t=")">）</button>
  </div>

  <div class="formula-stack">
    <div class="formula-row">
      <div class="equals blank">＝</div>
      <div id="originalBox" class="formula-box empty">ここに元の式が入るよ</div>
    </div>
  </div>

  <div class="row">
    <button id="undoBuild" class="btn">↩️ ひとつ戻す</button>
    <button id="start" class="btn primary">途中式スタート</button>
  </div>
</div>

<div id="workCard" class="card" style="display:none">
  <div class="title">② 途中式</div>
  <div id="formulaStack" class="formula-stack"></div>

  <div id="workArea" class="work">
    <b>どこから計算する？</b>
    <div class="tiny">計算する部分を選んで、その部分の答えだけ入れよう。</div>
    <div id="choices" class="choices"></div>
    <div id="selectedText" class="selected"></div>
    <div class="row">
      <input id="stepAnswer" inputmode="decimal" placeholder="その部分の答え">
      <button id="applyStep" class="btn primary">次の段へ</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <div class="row" style="margin-top:12px">
    <button id="undoStep" class="btn">↩️ 1段戻る</button>
    <button id="reset" class="btn danger">🗑️ 最初から</button>
  </div>
</div>
</div>

<script>
let build=[], work=[], history=[], selected=null;

const num=document.getElementById("num");
const originalBox=document.getElementById("originalBox");
const workCard=document.getElementById("workCard");
const formulaStack=document.getElementById("formulaStack");
const choices=document.getElementById("choices");
const selectedText=document.getElementById("selectedText");
const stepAnswer=document.getElementById("stepAnswer");
const msg=document.getElementById("msg");
const workArea=document.getElementById("workArea");

const disp=t=>t==="*"?"×":t==="/"?"÷":t;
const isNum=t=>/^-?(?:\d+(?:\.\d+)?|\.\d+)$/.test(t||"");
const show=a=>a.map(disp).join(" ");

function renderBuild(){
  if(build.length){
    originalBox.textContent=show(build);
    originalBox.classList.remove("empty");
  }else{
    originalBox.textContent="ここに元の式が入るよ";
    originalBox.classList.add("empty");
  }
}
function addNumber(){
  const v=num.value.trim();
  if(!isNum(v)) return;
  const p=build.at(-1);
  if(p&&(isNum(p)||p===")")) return;
  build.push(v); num.value=""; renderBuild();
}
document.getElementById("addNum").onclick=addNumber;
num.addEventListener("keydown",e=>{if(e.key==="Enter")addNumber()});

document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
  const t=b.dataset.t,p=build.at(-1);
  if(t==="("){
    if(p&&(isNum(p)||p===")")) return;
    build.push(t);
  }else if(t===")"){
    build.push(t);
  }else{
    if(!p||["+","-","*","/","("].includes(p)) return;
    build.push(t);
  }
  renderBuild();
});
document.getElementById("undoBuild").onclick=()=>{build.pop();renderBuild()};

function depthAt(a,i){
  let d=0;
  for(let k=0;k<i;k++){if(a[k]==="(")d++;if(a[k]===")")d--}
  return d;
}
function candidates(a){
  const out=[];
  for(let i=1;i<a.length-1;i++){
    if(!["+","-","*","/"].includes(a[i]))continue;
    if(!isNum(a[i-1])||!isNum(a[i+1]))continue;
    out.push({i,op:a[i],a:Number(a[i-1]),b:Number(a[i+1]),depth:depthAt(a,i)});
  }
  return out;
}
function preferred(a){
  const all=candidates(a);
  if(!all.length)return[];
  const md=Math.max(...all.map(x=>x.depth));
  const deep=all.filter(x=>x.depth===md);
  const mdops=deep.filter(x=>x.op==="*"||x.op==="/");
  return mdops.length?mdops:deep;
}
function renderStack(){
  formulaStack.innerHTML="";
  history.forEach((h,i)=>{
    const row=document.createElement("div");
    row.className="formula-row";
    const eq=document.createElement("div");
    eq.className="equals"+(i===0?" blank":"");
    eq.textContent="＝";
    const box=document.createElement("div");
    box.className="formula-box";
    box.textContent=show(h);
    row.appendChild(eq);row.appendChild(box);
    formulaStack.appendChild(row);
  });
}
function renderChoices(){
  selected=null; selectedText.textContent=""; choices.innerHTML="";
  const cs=candidates(work);
  cs.forEach(c=>{
    const b=document.createElement("button");
    b.className="pick";
    b.textContent=`${work[c.i-1]} ${disp(c.op)} ${work[c.i+1]}`;
    b.onclick=()=>{
      selected=c;
      document.querySelectorAll(".pick").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      selectedText.textContent="選んだところ： "+b.textContent;
      msg.textContent="";
    };
    choices.appendChild(b);
  });
  if(!cs.length) workArea.style.display="none";
  else workArea.style.display="block";
}
document.getElementById("start").onclick=()=>{
  if(!build.length)return;
  work=build.slice();
  history=[work.slice()];
  workCard.style.display="block";
  renderStack();renderChoices();msg.textContent="";
};

function valueOf(c){
  if(c.op==="+")return c.a+c.b;
  if(c.op==="-")return c.a-c.b;
  if(c.op==="*")return c.a*c.b;
  if(c.op==="/"){
    if(c.b===0)throw Error("0では割れないよ");
    return c.a/c.b;
  }
}
document.getElementById("applyStep").onclick=()=>{
  try{
    if(!selected){msg.className="msg warn";msg.textContent="まず計算するところを選んでね。";return}
    const pref=preferred(work);
    if(pref.length&&!pref.some(x=>x.i===selected.i)){
      msg.className="msg warn";
      msg.textContent="そこより先に計算するところがありそう。カッコの中 → ×÷ → ＋− の順を見てみよう。";
      return;
    }
    const v=Number(stepAnswer.value);
    if(stepAnswer.value.trim()===""||Number.isNaN(v)){msg.className="msg warn";msg.textContent="その部分の答えを入れてね。";return}
    const ans=valueOf(selected);
    if(Math.abs(v-ans)>1e-9){msg.className="msg warn";msg.textContent="おしい！選んだところだけ、もう一回計算してみよう。";return}

    work.splice(selected.i-1,3,String(v));
    for(let i=0;i<work.length-2;i++){
      if(work[i]==="("&&isNum(work[i+1])&&work[i+2]===")"){
        work.splice(i,3,work[i+1]);i=-1;
      }
    }
    history.push(work.slice());
    stepAnswer.value="";
    renderStack();renderChoices();

    if(work.length===1&&isNum(work[0])){
      msg.className="msg ok";msg.textContent="🎉 最後まで途中式を作れた！";
    }else{
      msg.className="msg ok";msg.textContent="いいね。次の段へ！";
    }
  }catch(e){msg.className="msg warn";msg.textContent=e.message}
};

document.getElementById("undoStep").onclick=()=>{
  if(history.length<=1)return;
  history.pop();
  work=history.at(-1).slice();
  renderStack();renderChoices();msg.textContent="";
};
document.getElementById("reset").onclick=()=>{
  build=[];work=[];history=[];selected=null;
  renderBuild();workCard.style.display="none";msg.textContent="";
};
renderBuild();
</script>
</body>
</html>
