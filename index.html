<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <title>しゃべる途中式</title>
  <style>
    :root{
      --bg:#f7f7fb;
      --card:#ffffff;
      --text:#222;
      --muted:#666;
      --line:#ddd;
      --accent:#111;
      --ok:#1f7a3f;
      --warn:#a76100;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic","Hiragino Sans",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:720px;
      margin:0 auto;
      padding:20px 16px 40px;
    }
    h1{font-size:28px;margin:10px 0 4px}
    .sub{color:var(--muted);margin-bottom:18px}
    .card{
      background:var(--card);
      border-radius:18px;
      padding:16px;
      margin:14px 0;
      box-shadow:0 4px 18px rgba(0,0,0,.06);
    }
    label{font-weight:700;display:block;margin-bottom:8px}
    input, textarea{
      width:100%;
      font-size:22px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:white;
    }
    textarea{min-height:90px;resize:vertical;font-size:18px}
    .row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
    }
    .mic{
      font-size:26px;
      min-width:58px;
      height:54px;
      border-radius:14px;
      border:1px solid var(--line);
      background:white;
    }
    .ops{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .op{
      font-size:34px;
      padding:14px 0;
      border:2px solid var(--line);
      background:white;
      border-radius:16px;
    }
    .op.active{
      border-color:#111;
      transform:scale(1.02);
    }
    .equation{
      font-size:38px;
      font-weight:800;
      text-align:center;
      padding:18px 8px;
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:center;
      word-break:break-word;
    }
    .question{
      font-size:22px;
      font-weight:700;
      margin-bottom:10px;
    }
    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    button.primary, button.secondary{
      border:none;
      border-radius:14px;
      padding:15px 12px;
      font-size:18px;
      font-weight:700;
    }
    button.primary{background:#111;color:white}
    button.secondary{background:#ececf2;color:#222}
    .message{
      margin-top:12px;
      font-size:18px;
      font-weight:700;
      min-height:28px;
    }
    .ok{color:var(--ok)}
    .warn{color:var(--warn)}
    .tiny{font-size:13px;color:var(--muted);line-height:1.5}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🗣️ しゃべる途中式</h1>
    <div class="sub">途中式は書かなくてOK。考えたことを、声か数字で入れよう。</div>

    <div class="card">
      <label for="problem">① 問題文</label>
      <textarea id="problem" placeholder="例：りんごが12こあります。5こ食べました。のこりはいくつ？"></textarea>
      <div class="tiny">※1号機では問題文は手入力です。写真読み取りは次の段階で追加できます。</div>
    </div>

    <div class="card">
      <div class="question">② 最初の数字は？</div>
      <div class="row">
        <input id="num1" inputmode="decimal" placeholder="例：12" />
        <button class="mic" data-target="num1" aria-label="最初の数字を音声入力">🎤</button>
      </div>
    </div>

    <div class="card">
      <div class="question">③ どうする？</div>
      <div class="ops">
        <button class="op" data-op="+">＋</button>
        <button class="op" data-op="-">−</button>
        <button class="op" data-op="×">×</button>
        <button class="op" data-op="÷">÷</button>
      </div>
    </div>

    <div class="card">
      <div class="question">④ 次の数字は？</div>
      <div class="row">
        <input id="num2" inputmode="decimal" placeholder="例：5" />
        <button class="mic" data-target="num2" aria-label="次の数字を音声入力">🎤</button>
      </div>
    </div>

    <div class="card">
      <div class="question">いまの途中式</div>
      <div class="equation" id="equation">＿ ？ ＿</div>
    </div>

    <div class="card">
      <div class="question">⑤ 答えはいくつ？</div>
      <div class="row">
        <input id="answer" inputmode="decimal" placeholder="答え" />
        <button class="mic" data-target="answer" aria-label="答えを音声入力">🎤</button>
      </div>
      <div class="actions">
        <button id="check" class="primary">答え合わせ</button>
        <button id="reset" class="secondary">もう一問</button>
      </div>
      <div class="message" id="message"></div>
    </div>

    <div class="card">
      <div class="question">🤔 わからん時</div>
      <button id="hint" class="secondary" style="width:100%">ヒントを出す</button>
      <div class="message" id="hintText"></div>
    </div>
  </div>

<script>
let selectedOp = "";

const num1 = document.getElementById("num1");
const num2 = document.getElementById("num2");
const answer = document.getElementById("answer");
const equation = document.getElementById("equation");
const message = document.getElementById("message");
const hintText = document.getElementById("hintText");

function normalizeNumberText(text){
  if(!text) return "";
  const fw = "０１２３４５６７８９．－";
  const hw = "0123456789.-";
  let out = text.trim();
  for(let i=0;i<fw.length;i++) out = out.split(fw[i]).join(hw[i]);
  out = out.replace(/[,\s]/g,"");

  const kanjiNums = {
    "ゼロ":"0","れい":"0","零":"0",
    "いち":"1","一":"1","に":"2","二":"2","さん":"3","三":"3",
    "よん":"4","し":"4","四":"4","ご":"5","五":"5","ろく":"6","六":"6",
    "なな":"7","しち":"7","七":"7","はち":"8","八":"8","きゅう":"9","く":"9","九":"9"
  };
  if(kanjiNums[out] !== undefined) return kanjiNums[out];

  const m = out.match(/-?\d+(?:\.\d+)?/);
  return m ? m[0] : out;
}

function updateEquation(){
  const a = num1.value || "＿";
  const b = num2.value || "＿";
  const op = selectedOp || "？";
  equation.textContent = `${a} ${op} ${b}`;
}

[num1,num2].forEach(el => el.addEventListener("input", updateEquation));

document.querySelectorAll(".op").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    selectedOp = btn.dataset.op;
    document.querySelectorAll(".op").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    updateEquation();
    message.textContent = "";
  });
});

function calc(a,b,op){
  switch(op){
    case "+": return a+b;
    case "-": return a-b;
    case "×": return a*b;
    case "÷": return b===0 ? NaN : a/b;
    default: return NaN;
  }
}

document.getElementById("check").addEventListener("click", ()=>{
  const a = Number(num1.value);
  const b = Number(num2.value);
  const user = Number(answer.value);

  if(num1.value==="" || num2.value==="" || answer.value==="" || !selectedOp){
    message.className = "message warn";
    message.textContent = "まだ空いているところがあるよ 👀";
    return;
  }

  const correct = calc(a,b,selectedOp);
  if(Number.isNaN(correct)){
    message.className = "message warn";
    message.textContent = "この計算はできないみたい。数字を見直してみよう。";
    return;
  }

  if(Math.abs(user-correct) < 1e-9){
    message.className = "message ok";
    message.textContent = `🎉 正解！ ${a} ${selectedOp} ${b} ＝ ${correct}`;
  }else{
    message.className = "message warn";
    message.textContent = "おしい！途中式を見ながら、もう一回考えてみよう。";
  }
});

document.getElementById("reset").addEventListener("click", ()=>{
  document.getElementById("problem").value = "";
  num1.value = "";
  num2.value = "";
  answer.value = "";
  selectedOp = "";
  document.querySelectorAll(".op").forEach(b=>b.classList.remove("active"));
  message.textContent = "";
  hintText.textContent = "";
  updateEquation();
});

document.getElementById("hint").addEventListener("click", ()=>{
  const problem = document.getElementById("problem").value;
  let hint = "『ふえる？へる？同じ数ずつ？分ける？』のどれか考えてみよう。";
  if(/のこり|残り|食べ|減|あげ|使い/.test(problem)){
    hint = "「残り」「食べた」「使った」なら、数はへっていそう。➖かな？";
  }else if(/全部|ぜんぶ|あわせ|合計|ふえ|もら/.test(problem)){
    hint = "「全部」「あわせて」「もらった」なら、数はふえていそう。➕かな？";
  }else if(/ずつ|何倍|倍/.test(problem)){
    hint = "「同じ数ずつ」「何倍」なら、✖️を使うかもしれないよ。";
  }else if(/分け|一人分|1人分|何人/.test(problem)){
    hint = "「同じように分ける」「一人分」なら、➗を使うかもしれないよ。";
  }
  hintText.className = "message";
  hintText.textContent = hint;
});

document.querySelectorAll(".mic").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      alert("このブラウザでは音声入力ボタンが使えません。キーボード入力を使ってね。");
      return;
    }
    const recognition = new SR();
    recognition.lang = "ja-JP";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const target = document.getElementById(btn.dataset.target);
    btn.textContent = "🎙️";
    recognition.start();

    recognition.onresult = (event)=>{
      const text = event.results[0][0].transcript;
      target.value = normalizeNumberText(text);
      target.dispatchEvent(new Event("input"));
      btn.textContent = "🎤";
    };
    recognition.onerror = ()=>{
      btn.textContent = "🎤";
      alert("うまく聞き取れなかったよ。もう一度話すか、数字を入力してね。");
    };
    recognition.onend = ()=> btn.textContent = "🎤";
  });
});
</script>
</body>
</html>
