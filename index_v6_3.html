<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>しゃべる途中式 6.2号機</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#222;--muted:#666;--line:#dcdce3;--ok:#176c3a;--warn:#a45d00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic","Hiragino Sans",sans-serif}
.wrap{max-width:800px;margin:auto;padding:16px 14px 40px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:var(--muted);line-height:1.55;margin-bottom:12px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.055)}
.title{font-size:20px;font-weight:850;margin-bottom:10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modebtn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:18px 12px;font-size:18px;font-weight:850;text-align:left;line-height:1.35}
.modebtn small{display:block;color:var(--muted);font-size:13px;font-weight:650;margin-top:5px}
.modebtn.active{border-color:#111;background:#f0f0f3}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.startRow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.sign{text-align:center;font-size:34px;font-weight:900;padding-bottom:8px}
input{width:100%;font-size:24px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
label{display:block;font-size:14px;font-weight:700;color:#444;margin-bottom:6px}
.btn{border:none;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:800;background:#ececf2;color:#222}
.btn.primary{background:#111;color:#fff}.btn.danger{background:#f3eaea;color:#532b2b}
.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.op{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;font-size:27px;font-weight:850}
.stack{margin-top:8px}
.line{display:grid;grid-template-columns:42px 1fr;gap:6px;align-items:center;margin:8px 0}
.eq{text-align:center;font-size:28px;font-weight:900;color:#555}.eq.blank{color:transparent}
.box{min-height:68px;border:2px solid var(--line);border-radius:15px;padding:12px 14px;display:flex;align-items:center;font-size:29px;font-weight:850;line-height:1.45;word-break:break-word;background:#fff}
.box.small{font-size:19px;font-weight:750}
.prompt{border-top:1px solid #eee;padding-top:14px;margin-top:12px}
.promptTitle{font-size:22px;font-weight:900}.promptExpr{font-size:33px;font-weight:900;margin:8px 0 12px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick{border:2px solid #bbb;background:#fff;border-radius:14px;padding:11px 14px;font-size:21px;font-weight:850}
.pick.active{border-color:#111;background:#f0f0f3}
.msg{font-weight:800;line-height:1.5;min-height:24px;margin-top:8px}.ok{color:var(--ok)}.warn{color:var(--warn)}
.note{font-size:13px;color:var(--muted);line-height:1.5}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🗣️ しゃべる途中式 6.2号機</h1>
<div class="sub">四則計算・くり上がり・くり下がり・あまり・小数のたし算/ひき算まで対応。</div>

<div class="card">
  <div class="title">① どんな問題？</div>
  <div class="menu">
    <button class="modebtn" data-mode="normal">ふつうの四則計算<small>＋ − × ÷ ／（ ）あり</small></button>
    <button class="modebtn" data-mode="carry">くり上がりの計算<small>例：28 ＋ 17</small></button>
    <button class="modebtn" data-mode="borrow">くり下がりの計算<small>例：36 − 17</small></button>
    <button class="modebtn" data-mode="remainder">あまりのあるわり算<small>例：17 ÷ 5</small></button>
    <button class="modebtn" data-mode="decimalAdd">小数のたし算<small>例：1.2 ＋ 0.35</small></button>
    <button class="modebtn" data-mode="decimalSub">小数のひき算<small>例：2.4 − 0.75</small></button>
  </div>
</div>

<div id="inputCard" class="card hidden">
  <div class="title">② 元の式を入れる</div>

  <div id="normalInput" class="hidden">
    <div class="row">
      <input id="normalNum" inputmode="decimal" placeholder="数字">
      <button id="addNormalNum" class="btn primary">数字を追加</button>
    </div>
    <div class="ops">
      <button class="op" data-t="+">＋</button><button class="op" data-t="-">−</button>
      <button class="op" data-t="*">×</button><button class="op" data-t="/">÷</button>
      <button class="op" data-t="(">（</button><button class="op" data-t=")">）</button>
    </div>
    <div class="stack">
      <div class="line"><div class="eq blank">＝</div><div id="normalOriginal" class="box small">ここに元の式が入るよ</div></div>
    </div>
    <div class="row2">
      <button id="undoNormalBuild" class="btn">↩️ ひとつ戻す</button>
      <button id="startNormal" class="btn primary">途中式スタート</button>
    </div>
  </div>

  <div id="twoDigitInput" class="hidden">
    <div class="startRow">
      <div><label>上の数</label><input id="topNum" inputmode="numeric" placeholder="36"></div>
      <div id="twoDigitSign" class="sign">−</div>
      <div><label>下の数</label><input id="bottomNum" inputmode="numeric" placeholder="17"></div>
    </div>
    <div class="note" style="margin-top:10px">今は 2けた と 2けた の整数に対応。</div>
    <div class="row2" style="margin-top:12px">
      <button id="startTwoDigit" class="btn primary">途中式スタート</button>
      <button id="clearTwoDigit" class="btn">入力を消す</button>
    </div>
    <div id="twoDigitMsg" class="msg"></div>
  </div>

  <div id="remainderInput" class="hidden">
    <div class="startRow">
      <div><label>わられる数</label><input id="dividend" inputmode="numeric" placeholder="17"></div>
      <div class="sign">÷</div>
      <div><label>わる数</label><input id="divisor" inputmode="numeric" placeholder="5"></div>
    </div>
    <div class="row2" style="margin-top:12px">
      <button id="startRemainder" class="btn primary">途中式スタート</button>
      <button id="clearRemainder" class="btn">入力を消す</button>
    </div>
    <div id="remainderMsg" class="msg"></div>
  </div>

  <div id="decimalInput" class="hidden">
    <div class="startRow">
      <div><label>上の数</label><input id="decTop" inputmode="decimal" placeholder="1.2"></div>
      <div id="decimalSign" class="sign">＋</div>
      <div><label>下の数</label><input id="decBottom" inputmode="decimal" placeholder="0.35"></div>
    </div>
    <div class="note" style="margin-top:10px">小数点をそろえてから、位ごとに計算するよ。</div>
    <div class="row2" style="margin-top:12px">
      <button id="startDecimal" class="btn primary">途中式スタート</button>
      <button id="clearDecimal" class="btn">入力を消す</button>
    </div>
    <div id="decimalMsg" class="msg"></div>
  </div>
</div>

<div id="workCard" class="card hidden">
  <div class="title">③ 途中式</div>
  <div id="stack" class="stack"></div>

  <div id="workArea" class="prompt">
    <div id="promptTitle" class="promptTitle"></div>
    <div id="promptExpr" class="promptExpr"></div>
    <div id="choices" class="choices"></div>
    <div id="selectedText" style="font-size:21px;font-weight:800;min-height:30px"></div>
    <div class="row">
      <input id="answerInput" inputmode="decimal" placeholder="この段の答え">
      <button id="nextBtn" class="btn primary">次へ</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <div class="row2" style="margin-top:12px">
    <button id="undoStep" class="btn">↩️ 1段戻る</button>
    <button id="resetAll" class="btn danger">🗑️ 最初から</button>
  </div>
</div>
</div>

<script>
let mode=null, build=[], work=[], history=[], selected=null, guided=null;

const inputCard=document.getElementById("inputCard"), workCard=document.getElementById("workCard");
const stack=document.getElementById("stack"), workArea=document.getElementById("workArea");
const promptTitle=document.getElementById("promptTitle"), promptExpr=document.getElementById("promptExpr");
const choices=document.getElementById("choices"), selectedText=document.getElementById("selectedText");
const answerInput=document.getElementById("answerInput"), msg=document.getElementById("msg");
const twoDigitMsg=document.getElementById("twoDigitMsg"), remainderMsg=document.getElementById("remainderMsg"), decimalMsg=document.getElementById("decimalMsg");

const disp=t=>t==="*"?"×":t==="/"?"÷":t;
const isNum=t=>/^-?(?:\d+(?:\.\d+)?|\.\d+)$/.test(t||"");
const show=a=>a.map(disp).join(" ");

function clearWorkState(){
  build=[];work=[];history=[];selected=null;guided=null;
  stack.innerHTML="";choices.innerHTML="";selectedText.textContent="";
  promptTitle.textContent="";promptExpr.textContent="";answerInput.value="";
  msg.textContent="";workCard.classList.add("hidden");
  ["normalNum","topNum","bottomNum","dividend","divisor","decTop","decBottom"].forEach(id=>document.getElementById(id).value="");
  twoDigitMsg.textContent="";remainderMsg.textContent="";decimalMsg.textContent="";
  renderNormalBuild();
}

function setMode(m){
  clearWorkState();
  mode=m;
  document.querySelectorAll(".modebtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  inputCard.classList.remove("hidden");
  document.getElementById("normalInput").classList.toggle("hidden",m!=="normal");
  document.getElementById("twoDigitInput").classList.toggle("hidden",!(m==="carry"||m==="borrow"));
  document.getElementById("remainderInput").classList.toggle("hidden",m!=="remainder");
  document.getElementById("decimalInput").classList.toggle("hidden",!(m==="decimalAdd"||m==="decimalSub"));
  if(m==="carry")document.getElementById("twoDigitSign").textContent="＋";
  if(m==="borrow")document.getElementById("twoDigitSign").textContent="−";
  if(m==="decimalAdd")document.getElementById("decimalSign").textContent="＋";
  if(m==="decimalSub")document.getElementById("decimalSign").textContent="−";
}
document.querySelectorAll(".modebtn").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

function makeLine(text,small=false,first=false){
  const row=document.createElement("div");row.className="line";
  const eq=document.createElement("div");eq.className="eq"+(first?" blank":"");eq.textContent="＝";
  const box=document.createElement("div");box.className="box"+(small?" small":"");box.textContent=text;
  row.append(eq,box);return row;
}
function renderStack(lines){
  stack.innerHTML="";
  lines.forEach((x,i)=>stack.appendChild(makeLine(x.text,x.small||false,i===0)));
}
function setMsg(t,cls="warn"){msg.className="msg "+cls;msg.textContent=t}

// NORMAL
const normalNum=document.getElementById("normalNum"), normalOriginal=document.getElementById("normalOriginal");
function renderNormalBuild(){normalOriginal.textContent=build.length?show(build):"ここに元の式が入るよ"}
document.getElementById("addNormalNum").onclick=()=>{
  const v=normalNum.value.trim();if(!isNum(v))return;
  const p=build.at(-1);if(p&&(isNum(p)||p===")"))return;
  build.push(v);normalNum.value="";renderNormalBuild();
};
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
  const t=b.dataset.t,p=build.at(-1);
  if(t==="("){if(p&&(isNum(p)||p===")"))return;build.push(t)}
  else if(t===")"){build.push(t)}
  else{if(!p||["+","-","*","/","("].includes(p))return;build.push(t)}
  renderNormalBuild();
});
document.getElementById("undoNormalBuild").onclick=()=>{build.pop();renderNormalBuild()};

function depthAt(a,i){let d=0;for(let k=0;k<i;k++){if(a[k]==="(")d++;if(a[k]===")")d--}return d}
function candidates(a){
  const out=[];for(let i=1;i<a.length-1;i++){
    if(!["+","-","*","/"].includes(a[i]))continue;
    if(!isNum(a[i-1])||!isNum(a[i+1]))continue;
    out.push({i,op:a[i],a:Number(a[i-1]),b:Number(a[i+1]),depth:depthAt(a,i)});
  }return out;
}
function preferred(a){
  const all=candidates(a);if(!all.length)return[];
  const md=Math.max(...all.map(x=>x.depth));const deep=all.filter(x=>x.depth===md);
  const mdops=deep.filter(x=>x.op==="*"||x.op==="/");return mdops.length?mdops:deep;
}
function val(c){
  if(c.op==="+")return c.a+c.b;if(c.op==="-")return c.a-c.b;if(c.op==="*")return c.a*c.b;
  if(c.op==="/"){if(c.b===0)throw Error("0では割れないよ");return c.a/c.b}
}
function renderNormalWork(){
  renderStack(history.map(h=>({text:show(h)})));
  choices.innerHTML="";selected=null;selectedText.textContent="";
  const cs=candidates(work);
  cs.forEach(c=>{
    const b=document.createElement("button");b.className="pick";
    b.textContent=`${work[c.i-1]} ${disp(c.op)} ${work[c.i+1]}`;
    b.onclick=()=>{selected=c;document.querySelectorAll(".pick").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedText.textContent="選んだところ： "+b.textContent;msg.textContent=""};
    choices.appendChild(b);
  });
  promptTitle.textContent="どこから計算する？";promptExpr.textContent="";
  workArea.style.display=cs.length?"block":"none";
}
document.getElementById("startNormal").onclick=()=>{
  if(!build.length)return;work=build.slice();history=[work.slice()];guided=null;
  workCard.classList.remove("hidden");renderNormalWork();
};

// TWO DIGIT
document.getElementById("startTwoDigit").onclick=()=>{
  twoDigitMsg.textContent="";
  const a=Number(document.getElementById("topNum").value),b=Number(document.getElementById("bottomNum").value);
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<10||a>99||b<10||b>99){
    twoDigitMsg.className="msg warn";twoDigitMsg.textContent="今は 10〜99 の2けたどうしに対応してるよ。";return;
  }
  if(mode==="borrow"&&a<b){twoDigitMsg.className="msg warn";twoDigitMsg.textContent="上の数を大きくしてね。";return}
  const t1=Math.floor(a/10),o1=a%10,t2=Math.floor(b/10),o2=b%10;
  let lines=[{text:`${a} ${mode==="carry"?"＋":"−"} ${b}`}],steps=[];
  if(mode==="borrow"){
    const borrow=o1<o2,onesTop=borrow?o1+10:o1,tensTop=borrow?(t1-1)*10:t1*10;
    lines.push({text:`数の分け方：${a} = ${tensTop} + ${onesTop} ／ ${b} = ${t2*10} + ${o2}`,small:true});
    const ones=onesTop-o2,tens=tensTop-t2*10;
    steps=[{label:"一の位",expr:`${onesTop} − ${o2}`,correct:ones},{label:"十の位",expr:`${tensTop} − ${t2*10}`,correct:tens},{label:"さいご",expr:`${tens} ＋ ${ones}`,correct:tens+ones}];
  }else{
    const ones=o1+o2;
    const carry=ones>=10;
    const onesDigit=ones%10;
    const carryTen=carry?10:0;
    const tensBase=(t1+t2)*10;

    lines.push({text:`数の分け方：${a} = ${t1*10} + ${o1} ／ ${b} = ${t2*10} + ${o2}`,small:true});

    steps=[
      {
        label:"一の位",
        expr:`${o1} ＋ ${o2}`,
        correct:ones,
        note:carry
          ? `${onesDigit}を一の位に残して、10を十の位へくり上げる`
          : `${onesDigit}を一の位に残す`
      },
      {
        label:"十の位",
        expr:carry
          ? `${t1*10} ＋ ${t2*10} ＋ ${carryTen}`
          : `${t1*10} ＋ ${t2*10}`,
        correct:tensBase+carryTen,
        note:carry ? `くり上がった10も足す` : `そのまま計算する`
      },
      {
        label:"さいご",
        expr:`${tensBase+carryTen} ＋ ${onesDigit}`,
        correct:a+b,
        note:`十の位と、一の位に残った${onesDigit}を合わせる`
      }
    ];
  }
  guided={lines,steps,answers:[]};workCard.classList.remove("hidden");renderGuided();
};
document.getElementById("clearTwoDigit").onclick=()=>{document.getElementById("topNum").value="";document.getElementById("bottomNum").value="";twoDigitMsg.textContent="";workCard.classList.add("hidden");guided=null};

// REMAINDER
document.getElementById("startRemainder").onclick=()=>{
  remainderMsg.textContent="";
  const a=Number(document.getElementById("dividend").value),b=Number(document.getElementById("divisor").value);
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<=0){remainderMsg.className="msg warn";remainderMsg.textContent="0以上の整数 ÷ 1以上の整数で入れてね。";return}
  const q=Math.floor(a/b),r=a%b;
  guided={lines:[{text:`${a} ÷ ${b}`}],steps:[{label:"何回入る？",expr:`${b} × ? ≤ ${a}`,correct:q},{label:"使った数",expr:`${b} × ${q}`,correct:b*q},{label:"あまり",expr:`${a} − ${b*q}`,correct:r}],answers:[],remainder:{q,r}};
  workCard.classList.remove("hidden");renderGuided();
};
document.getElementById("clearRemainder").onclick=()=>{document.getElementById("dividend").value="";document.getElementById("divisor").value="";remainderMsg.textContent="";workCard.classList.add("hidden");guided=null};

// DECIMALS
function decimalPlaces(s){
  const p=s.indexOf(".");
  return p<0?0:s.length-p-1;
}
function normalizeDecimalString(s,places){
  const n=Number(s);
  if(!Number.isFinite(n))return null;
  return n.toFixed(places);
}
document.getElementById("startDecimal").onclick=()=>{
  decimalMsg.textContent="";
  const aRaw=document.getElementById("decTop").value.trim();
  const bRaw=document.getElementById("decBottom").value.trim();
  const a=Number(aRaw),b=Number(bRaw);
  if(!Number.isFinite(a)||!Number.isFinite(b)){decimalMsg.className="msg warn";decimalMsg.textContent="小数または整数を入れてね。";return}
  if(mode==="decimalSub"&&a<b){decimalMsg.className="msg warn";decimalMsg.textContent="今の小数ひき算版では、上の数を大きくしてね。";return}
  const places=Math.max(decimalPlaces(aRaw),decimalPlaces(bRaw));
  const aNorm=normalizeDecimalString(aRaw,places),bNorm=normalizeDecimalString(bRaw,places);
  const factor=10**places;
  const A=Math.round(a*factor),B=Math.round(b*factor);
  const op=mode==="decimalAdd"?"＋":"−";
  const resultInt=mode==="decimalAdd"?A+B:A-B;
  const result=(resultInt/factor).toFixed(places);

  const lines=[
    {text:`${aRaw} ${op} ${bRaw}`},
    {text:`小数点をそろえる：${aNorm} ${op} ${bNorm}`,small:true}
  ];

  const steps=[];
  let carry=0;
  let borrow=0;
  const aDigits=aNorm.replace(".","").split("").map(Number);
  const bDigits=bNorm.replace(".","").split("").map(Number);
  const placeNames=[];
  for(let i=0;i<aDigits.length;i++){
    const fromRight=aDigits.length-1-i;
    if(fromRight<places){
      const names=["十分の位","百分の位","千分の位","万分の位"];
      placeNames[i]=names[places-1-fromRight]||`小数第${places-fromRight}位`;
    }else if(fromRight===places){
      placeNames[i]="一の位";
    }else if(fromRight===places+1){
      placeNames[i]="十の位";
    }else if(fromRight===places+2){
      placeNames[i]="百の位";
    }else{
      placeNames[i]="上の位";
    }
  }

  if(mode==="decimalAdd"){
    for(let i=aDigits.length-1;i>=0;i--){
      const sum=aDigits[i]+bDigits[i]+carry;
      const digit=sum%10;
      const nextCarry=Math.floor(sum/10);
      steps.push({
        label:placeNames[i],
        expr:`${aDigits[i]} ＋ ${bDigits[i]}${carry?` ＋ ${carry}`:""}`,
        correct:sum,
        note:`この位は ${digit}${nextCarry?"、1くり上がる":""}`
      });
      carry=nextCarry;
    }
  }else{
    for(let i=aDigits.length-1;i>=0;i--){
      let top=aDigits[i]-borrow;
      let extra=0;
      if(top<bDigits[i]){
        top+=10;extra=1;
      }
      const diff=top-bDigits[i];
      steps.push({
        label:placeNames[i],
        expr:`${top} − ${bDigits[i]}`,
        correct:diff,
        note:extra?"1つ上の位から 1 くり下げたよ":"そのままひけるよ"
      });
      borrow=extra;
    }
  }

  steps.push({label:"さいご",expr:`答え`,correct:Number(result),displayResult:result});
  guided={lines,steps,answers:[],decimal:true,result};
  workCard.classList.remove("hidden");renderGuided();
};
document.getElementById("clearDecimal").onclick=()=>{document.getElementById("decTop").value="";document.getElementById("decBottom").value="";decimalMsg.textContent="";workCard.classList.add("hidden");guided=null};

function renderGuided(){
  const lines=guided.lines.slice();
  guided.answers.forEach((ans,i)=>{
    const s=guided.steps[i];
    if(s.label==="さいご"){
      lines.push({text:`答え：${guided.decimal?guided.result:ans}`});
    }else{
      lines.push({text:`${s.label}：${s.expr} = ${ans}${s.note?`（${s.note}）`:""}`,small:true});
    }
  });
  if(guided.answers.length===guided.steps.length && mode==="remainder"){
    lines.push({text:`答え：${guided.remainder.q} あまり ${guided.remainder.r}`});
  }
  renderStack(lines);choices.innerHTML="";selectedText.textContent="";
  if(guided.answers.length>=guided.steps.length){workArea.style.display="none";return}
  workArea.style.display="block";
  const s=guided.steps[guided.answers.length];
  promptTitle.textContent=s.label+" を考えよう";
  promptExpr.textContent=s.label==="さいご"?(guided.decimal?"小数点をそろえて答えを書こう":"答えを書こう"):`${s.expr} = ?`;
}

document.getElementById("nextBtn").onclick=()=>{
  try{
    if(mode==="normal"){
      if(!selected){setMsg("まず計算するところを選んでね。");return}
      const pref=preferred(work);
      if(pref.length&&!pref.some(x=>x.i===selected.i)){setMsg("そこより先に計算するところがありそう。カッコの中 → ×÷ → ＋− の順を見てみよう。");return}
      const v=Number(answerInput.value);if(answerInput.value.trim()===""||Number.isNaN(v)){setMsg("この段の答えを入れてね。");return}
      const a=val(selected);if(Math.abs(v-a)>1e-9){setMsg("おしい！その部分だけもう一回。");return}
      work.splice(selected.i-1,3,String(v));
      for(let i=0;i<work.length-2;i++){if(work[i]==="("&&isNum(work[i+1])&&work[i+2]===")"){work.splice(i,3,work[i+1]);i=-1}}
      history.push(work.slice());answerInput.value="";renderNormalWork();setMsg("いいね。次の段へ！","ok");return;
    }

    if(!guided)return;
    const s=guided.steps[guided.answers.length];
    const raw=answerInput.value.trim();
    if(raw===""){setMsg("この段の答えを入れてね。");return}
    const v=Number(raw);
    if(Number.isNaN(v)){setMsg("数字で入れてね。");return}

    if(s.label==="さいご" && guided.decimal){
      if(Math.abs(v-Number(guided.result))>1e-9){setMsg("おしい！小数点の位置を見てみよう。");return}
      guided.answers.push(guided.result);
    }else{
      if(Math.abs(v-s.correct)>1e-9){setMsg("おしい！この段だけもう一回。");return}
      guided.answers.push(v);
    }
    answerInput.value="";renderGuided();setMsg("いいね！","ok");
  }catch(e){setMsg(e.message)}
};

document.getElementById("undoStep").onclick=()=>{
  if(mode==="normal"){
    if(history.length<=1)return;history.pop();work=history.at(-1).slice();renderNormalWork();msg.textContent="";
  }else if(guided&&guided.answers.length){guided.answers.pop();renderGuided();msg.textContent=""}
};
document.getElementById("resetAll").onclick=()=>{
  mode=null;clearWorkState();
  document.querySelectorAll(".modebtn").forEach(b=>b.classList.remove("active"));
  inputCard.classList.add("hidden");
};
renderNormalBuild();
</script>
